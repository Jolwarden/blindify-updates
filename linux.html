<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blindify – Linux</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#111; color:#eee; margin:0; padding:2rem; }
    h1 { margin-bottom: 1rem; }
    a { color:#8fd3ff; display:block; margin:1rem 0; font-size:1.2rem; text-decoration:none; }
    a:hover { text-decoration:underline; }
    .error { color:#f55; }
  </style>
</head>
<body>
  <h1>🎵 Blindify – Linux</h1>
  <div id="download">Chargement...</div>

  <script>
    fetch('./latest-linux.json')
      .then(r => {
        if (!r.ok) throw new Error('Pas de release Linux trouvée.');
        return r.json();
      })
      .then(data => {
        if (data.platforms && data.platforms["linux-x86_64"]) {
          const link = data.platforms["linux-x86_64"].url;
          document.getElementById('download').innerHTML =
            `<a href="${link}">⬇️ Télécharger la version ${data.version}</a>`;
        } else {
          document.getElementById('download').innerHTML =
            `<p class="error">Aucune build Linux disponible pour l’instant.</p>`;
        }
      })
      .catch(err => {
        document.getElementById('download').innerHTML =
          `<p class="error">${err.message}</p>`;
      });
  </script>
</body>
</html>
